name: Broderie — APK + Windows

on:
  push:
    branches: ["broderie"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,windows --org com.broderie --project-name broderie .
          sed -i 's/android:label="broderie"/android:label="Broderie"/' android/app/src/main/AndroidManifest.xml
          if [ -f android/build.gradle.kts ]; then F=android/build.gradle.kts; else F=android/build.gradle; fi
          printf '\nsubprojects {\n    tasks.matching { it.name.contains("lintVital") }.configureEach { enabled = false }\n}\n' >> $F
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk broderie-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: broderie-android
          path: broderie-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --org com.broderie --project-name broderie .
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath broderie-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: broderie-windows
          path: broderie-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: git -C src log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: broderie-v0.1.${{ github.run_number }}
          name: Broderie v0.1.${{ github.run_number }} (prototype)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            broderie-android.apk
            broderie-windows.zip
