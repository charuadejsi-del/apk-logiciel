name: munazir
description: "حسبنا كتاب الله — أداة المناظرة: القرآن وحده."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#0F4D3A"
  adaptive_icon_foreground: "assets/brand/icon_fg.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/brand/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/books/
    - assets/brand/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
